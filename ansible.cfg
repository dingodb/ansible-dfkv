[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# dfkv has no service user: binaries, data dirs and systemd units are all root
# owned (see dfkv-rollout, where every remote command is `ssh root@<ip>`).
# Region group_vars may override this, but nothing in this repo needs to.
remote_user = root
host_key_checking = False
retry_files_enabled = False
# YAML-formatted task output. This used to be `stdout_callback = yaml`, but that
# plugin ships in community.general and was removed in community.general 12.0.0;
# with a newer collection installed, ansible-playbook aborts at startup with
# "The 'community.general.yaml' callback plugin has been removed". Note that
# --syntax-check does not load callback plugins, so it cannot catch this.
# The ansible-core 2.13+ equivalent is the default callback plus this option
# (the key is callback_result_format, not result_format).
stdout_callback = default
callback_result_format = yaml
timeout = 30

[privilege_escalation]
# Everything already runs as root, so no escalation is needed by default.
# Playbooks that must run against a non-root remote_user set `become: true`
# explicitly rather than relying on this.
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3
