---
# Sample inventory. Real clusters are driven from the private env repo:
#
#   ansible-playbook -i ../ansible-dfkv-env/<region>/hosts.py \
#                    -i ../ansible-dfkv-env/<region>/hosts-mds.yml \
#                    playbooks/dfkv_site.yml
#
# Two reasons a region needs two inventory sources:
#   * cache_servers live inside the k8s cluster  -> dynamic, kubectl-driven
#   * mds/etcd nodes deliberately do NOT          -> static, hand-maintained
#
# Group model
# -----------
# Roles are selected by *group*, never by a node-name pattern. The rollout this
# replaces inferred "is this an MDS?" from `*-cpu-*` in the hostname, which broke
# silently in bj11 where the MDS hosts are named `bj11-dingofs-00NN`; an
# unfiltered `upgrade` then restarted dfkv-server on them.
#
# The six groups below are structural: playbooks reference them by name, so a
# region inventory must define the same ones. `observability_servers` overlaps
# `mds_servers` on purpose (the stack runs on an MDS node) but is declared
# separately so nothing has to guess "the first MDS" by index.
all:
  children:
    # --- etcd quorum. Not in k8s. 1 node is valid for a dev region; 3 for prod.
    etcd_servers:
      hosts:
        dfkv-mds-1:
          ansible_host: 10.225.10.50
        dfkv-mds-2:
          ansible_host: 10.225.10.51
        dfkv-mds-3:
          ansible_host: 10.225.10.52

    # --- dfkv_mds control plane. Stateless; same host set as etcd by default,
    # but kept distinct because MDS_ROOT may differ (bj09 runs MDS from
    # /root/dfkv while its servers use /root/dfkv2).
    mds_servers:
      hosts:
        dfkv-mds-1:
          ansible_host: 10.225.10.50
          dfkv_mds_root: /root/dfkv
        dfkv-mds-2:
          ansible_host: 10.225.10.51
          dfkv_mds_root: /root/dfkv
        dfkv-mds-3:
          ansible_host: 10.225.10.52
          dfkv_mds_root: /root/dfkv

    # --- dfkv_server cache nodes. These are the GPU nodes, in k8s in prod.
    # Every per-node knob is an ordinary host variable here -- that is the whole
    # point of moving them out of the flattened `SERVER_*_MAP` strings the
    # rollout used, where the key had to match the OS hostname while every other
    # map keyed on the inventory name.
    cache_servers:
      hosts:
        # Note what is NOT here: no capacity, no disk list. Both are derived
        # from the disks the node actually has (roles/dfkv_server/tasks/
        # select_disks.yml) so they cannot drift from the hardware or from the
        # other system sharing the same NVMes.
        dfkv-cache-1:
          ansible_host: 10.225.10.60
          dfkv_weight: 1
          dfkv_advertise_iface: ib6s200p0
          dfkv_rdma_dev: ib7s400p0
          dfkv_ram_tier: true
          dfkv_ram_tier_bytes: 17179869184     # 16 GiB
        dfkv-cache-2:
          ansible_host: 10.225.10.61
          dfkv_weight: 1
          dfkv_advertise_iface: ib6s200p0
          dfkv_rdma_dev: ib7s400p0
          dfkv_ram_tier: true
          dfkv_ram_tier_bytes: 17179869184

    # --- Where the telemetry stack runs. Normally one of the mds_servers.
    observability_servers:
      hosts:
        dfkv-mds-1:
          ansible_host: 10.225.10.50

    # --- The node that writes the versioned client tree onto the shared
    # filesystem (DingoFS / GPFS). Any host that can see the mount.
    client_stage:
      hosts:
        dfkv-mds-1:
          ansible_host: 10.225.10.50

    # --- Control-plane bookkeeping. Nothing is deployed here; playbooks that
    # need a single host to act from (`delegate_to`) or to run a CLI against the
    # cluster target this group.
    admin:
      hosts:
        dfkv-mds-1:
          ansible_host: 10.225.10.50
