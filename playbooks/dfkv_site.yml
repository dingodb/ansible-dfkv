---
# Master playbook: full greenfield bring-up of a dfkv cluster.
#
# Every playbook here is numbered for the order it runs in, so `ls playbooks/`
# reads as the deploy sequence. 00-08 are the bring-up chain, 90-91 are lifecycle
# actions (upgrade, uninstall), 99 is read-only. 08_client is the one that sits
# outside the chain: it publishes client artifacts to a shared filesystem and is
# not part of bringing a region up.
#
# This is the ordering the fleet tooling encoded as `deploy`, and it is the only
# place in this repo where the steps are sequenced. Every step below is also a
# standalone playbook -- run it directly to re-apply just that one.
#
# ============================================================
# Why this order
# ============================================================
#   01 prepare      : packages, directories, RDMA provider check.
#   02 release      : fetch once on the control node, push to every target.
#                     Nothing is running yet; nothing can be disrupted.
#   03 etcd         : the only authoritative state in the system. Must be healthy
#                     before any MDS starts, because an MDS that cannot reach
#                     etcd exits rather than degrading.
#   04 mds          : must be up before any server, because a server's first
#                     registration has a hard 60s deadline and it exits 1 on
#                     expiry. Servers do not queue waiting for the MDS.
#   05 server       : the ring itself. Cluster mode engages here.
#   06 verify       : assert against the ring, not against the inventory.
#   07 observability: last. Servers do not need it, and bringing it up after the
#                     ring means its first scrape sees a fully-formed cluster
#                     instead of filling the dashboards with startup noise.
#
# There is deliberately no host-tuning playbook. The obvious candidate --
# jemalloc, hugepages, sysctl, cpupower -- does not apply, and the settings that
# do matter are per-service rather than per-host, so they live in the units under
# roles/dfkv_server and roles/dfkv_etcd where they travel with the service they
# belong to:
#
#   * LimitMEMLOCK=infinity  -- the RAM arena, RDMA memory regions and CUDA
#     pinned buffers are all locked pages.
#   * LimitNOFILE=1048576    -- slab in direct mode holds two descriptors per
#     extent, roughly 10k on a 5 TiB node.
#   * TimeoutStartSec=600    -- slab pre-touches the arena and registers MRs at
#     about 5-10s per 16 GiB, overrunning systemd's 90s default.
#   * OOMScoreAdjust=-500    -- a cache node that dies to the OOM killer is
#     worse than one that holds its memory.
#
# vm.swappiness is in particular not needed: the RAM arena is mlocked, and
# locked pages are not reclaimable, so swapping cannot touch it.
#
# ============================================================
# Re-running: what happens on the second run, step by step
# ============================================================
#   01 prepare      : no-op (packages and directories).
#   02 release      : no-op. The release directory is immutable; re-staging the
#                     same version with a changed launcher fails rather than
#                     silently rewriting a directory a rollback depends on.
#   03 etcd         : REFUSES TO RUN if etcd is already active. Re-bootstrapping
#                     a live quorum destroys the member set.
#   04 mds          : rewrites env/unit only if their content changed; restarts
#                     only on change.
#   05 server       : same. A converged server is not restarted, so its RAM arena
#                     and open connections survive a re-run.
#   06 verify       : read-only.
#   07 observability: content-addressed bundle; same inputs means no restart.
#
# ============================================================
# Preflight
#
# Worth its own step rather than relying on the first task that happens to use a
# variable: a region whose group_vars is incomplete fails here, naming the file
# and the missing variable, instead of part-way through a deploy pointing at the
# line that read it.
# ============================================================
- name: "Preflight: region inventory is complete"
  import_playbook: 00_check_config.yml

- name: "01 prepare: system preparation"
  import_playbook: 01_prepare.yml

- name: "02 release: stage the release"
  import_playbook: 02_release.yml

- name: "03 etcd: bootstrap the quorum"
  import_playbook: 03_etcd.yml

- name: "04 mds: deploy the control plane"
  import_playbook: 04_mds.yml

- name: "05 server: deploy the cache ring"
  import_playbook: 05_server.yml

- name: "06 verify: assert against the ring"
  import_playbook: 06_verify.yml

- name: "07 observability: telemetry stack"
  import_playbook: 07_observability.yml
