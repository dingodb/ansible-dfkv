---
# Verification asserts against the ring, not against the inventory.
#
# The fleet tooling this replaces walked nodes.txt and reported a healthy
# cluster for 13 days while a node that had been removed from the list -- but
# never disabled -- came back on reboot, re-registered into the ring and served
# 2.7% of the keyspace. It was invisible because it was no longer in the list
# being walked. Any check that iterates over the inventory has the same hole.
#
# So: the ring is asked what it thinks it contains, and that answer is compared
# against what the region declares. A count mismatch is reported as a mismatch.
# hd02 carries a known hardware-failed node whose gap is deliberately preserved
# in both the ring count and the monitoring target count; narrowing the
# expectation to make the output green is not an option this role offers.

dfkv_verify_groups:
  - "{{ dfkv_group }}"

# Whether this region runs any cache nodes at all.
#
# A region with none -- control plane only, which is what a region without GPU
# nodes gets -- has no ring to assert against, and an empty ring is then the
# correct answer rather than a failure. The control-plane assertions below cover
# everything such a region actually runs.
#
# Derived from the group rather than from a configured count on purpose. The
# role compares the ring against etcd (both live), never against the inventory: a
# region may legitimately declare more cache nodes than are online, which is what
# bj11 does with 70 declared and 52 in the ring.
dfkv_verify_has_ring: "{{ (groups['cache_servers'] | default([]) | length) > 0 }}"

# Every (host, unit) pair that has to come back on its own after a reboot.
# Built from the groups rather than listed, so a region that adds cache nodes
# gets the server units checked without editing this.
dfkv_verify_units: >-
  {{ (groups['etcd_servers'] | default([]) | product([dfkv_etcd_service]) | list)
     + (groups['mds_servers'] | default([]) | product([dfkv_mds_service]) | list)
     + (groups['cache_servers'] | default([]) | product([dfkv_server_service]) | list) }}

# Server -> MDS registration lives in etcd under this prefix.
dfkv_verify_etcd_prefix: /dfkv/v1/groups

# The arena size the ring will report, which is not the configured budget.
# The ring reports the fixed arena truth: the budget minus two oversized-value
# extents reserved on each side, rounded down to the 4 KiB page.
dfkv_verify_ram_reserve_bytes: 67108864
dfkv_verify_expected_ram: >-
  {{ (((dfkv_ram_tier_bytes | int)
       - ([dfkv_verify_ram_reserve_bytes | int,
           (dfkv_ram_tier_bytes | int) - 4096] | min))
      // 4096 * 4096) }}

dfkv_verify_timeout: 30
